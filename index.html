<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
        }

        .form-container h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: var(--text-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .radio-checkbox-group {
            margin-top: 5px;
        }

        .radio-checkbox-label {
            display: inline-flex;
            align-items: center;
            margin-right: 15px;
            font-weight: normal;
            font-size: 14px;
            cursor: pointer;
        }

        .radio-checkbox-label input {
            margin-right: 6px;
        }

        .btn-submit {
            display: width;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registration Form</h2>
    <form action="#" method="POST">
        
        <!-- Text Input -->
        <div class="form-group">
            <label Pis for="full-name">Full Name</label>
            <input type="text" id="full-name" name="fullName" class="form-control" placeholder="John Doe" required>
        </div>

        <!-- Email Input -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
        </div>

        <!-- Dropdown Select -->
        <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country" class="form-control" required>
                <option value="" disabled selected>Select your country</option>
                <option value="us">United States</option>
                <option value="ca">Canada</option>
                <option value="uk">United Kingdom</option>
                <option value="au">Australia</option>
            </select>
        </div>

        <!-- Radio Buttons -->
        <div class="form-group">
            <label>Preferred Contact Method</label>
            <div class="radio-checkbox-group">
                <label class="radio-checkbox-label">
                    <input type="radio" name="contactMethod" value="email" checked> Email
                </label>
                <label class="radio-checkbox-label">
                    <input type="radio" name="contactMethod" value="phone"> Phone
                </label>
            </div>
        </div>

        <!-- Checkbox -->
        <div class="form-group">
            <div class="radio-checkbox-group">
                <label class="radio-checkbox-label">
                    <input type="checkbox" name="terms" required> I agree to the terms and conditions
                </label>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit">Submit Application</button>

    </form>
</div>

</body>
</html>
